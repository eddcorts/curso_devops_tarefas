apiVersion: apps/v1
kind: Deployment

metadata:
  name: server
  labels:
    app: nginx

spec:
  replicas: 3
  selector:
    matchLabels:
      app: server
      tier: frontend

  template:
    metadata:
      labels:
        app: server
        tier: frontend
    spec:
      containers:
        - name: nginx
          image: nginx:1.28.0
          ports:
            - containerPort: 80
