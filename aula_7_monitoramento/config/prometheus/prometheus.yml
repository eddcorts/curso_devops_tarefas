global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: node-exporter
    static_configs:
      - targets:
          - "172.27.0.1:9100"
  - job_name: loki-metrics
    static_configs:
      - targets:
          - "172.27.0.1:3100"
  - job_name: fastapi-metrics
    static_configs:
      - targets:
          - "172.27.0.1:8888"
